<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1800" viewBox="0 0 1800 1800">
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#15803d"/>
    </marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#b45309"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 42px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 22px; fill: #475569; }
      .group-title { font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: 700; fill: #1e3a8a; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #0f172a; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #334155; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #475569; }
      .pill { font-family: Arial, Helvetica, sans-serif; font-size: 17px; font-weight: 700; fill: #0f172a; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 22; filter: url(#shadow); }
      .azure { fill: #e8f2ff; stroke: #0078d4; stroke-width: 3; rx: 22; filter: url(#shadow); }
      .compute { fill: #e9f9ef; stroke: #16a34a; stroke-width: 3; rx: 22; filter: url(#shadow); }
      .queue { fill: #fff7db; stroke: #f59e0b; stroke-width: 3; rx: 22; filter: url(#shadow); }
      .support { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 3; rx: 22; filter: url(#shadow); }
      .line-blue { fill: none; stroke: #2563eb; stroke-width: 5; marker-end: url(#arrow-blue); }
      .line-green { fill: none; stroke: #15803d; stroke-width: 5; marker-end: url(#arrow-green); }
      .line-amber { fill: none; stroke: #b45309; stroke-width: 5; marker-end: url(#arrow-amber); }
      .line-muted { fill: none; stroke: #94a3b8; stroke-width: 4; stroke-dasharray: 10 10; marker-end: url(#arrow-blue); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1800"/>

  <text class="title" x="70" y="78">PDF Remediation on Azure</text>
  <text class="subtitle" x="70" y="116">Secure sign-in, direct PDF upload, queue-driven processing, and one job per PDF.</text>

  <rect class="box" x="70" y="180" width="280" height="160"/>
  <text class="label" x="110" y="238">Court Staff</text>
  <text class="small" x="110" y="272">Judicial Council</text>
  <text class="small" x="110" y="300">Supreme, Appellate,</text>
  <text class="small" x="110" y="328">and Trial Courts</text>

  <rect class="azure" x="430" y="170" width="290" height="170"/>
  <text class="label" x="470" y="230">Azure Entra ID</text>
  <text class="small" x="470" y="268">Sign-in and access</text>
  <text class="small" x="470" y="298">control</text>

  <rect class="compute" x="800" y="150" width="350" height="210"/>
  <text class="label" x="840" y="216">Web App and API</text>
  <text class="small" x="840" y="254">Azure Container App</text>
  <text class="small" x="840" y="286">Creates one job per PDF</text>
  <text class="small" x="840" y="318">Issues direct upload URL</text>

  <rect class="azure" x="1240" y="150" width="410" height="210"/>
  <text class="label" x="1280" y="210">Azure Blob Storage</text>
  <text class="small" x="1280" y="248">Direct PDF uploads</text>
  <text class="small" x="1280" y="280">Reports and remediated PDF</text>
  <text class="small" x="1280" y="312">Manifest per job</text>

  <path class="line-blue" d="M350 245 C380 245, 395 245, 430 245"/>

  <path class="line-blue" d="M720 245 C750 245, 765 245, 800 245"/>

  <path class="line-green" d="M350 318 C640 430, 955 425, 1240 318"/>
  <rect x="735" y="395" width="235" height="34" rx="17" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="tiny" x="762" y="418">direct PDF upload</text>

  <rect class="queue" x="700" y="470" width="430" height="210"/>
  <text class="label" x="740" y="532">Azure Service Bus</text>
  <text class="small" x="740" y="570">Dispatcher queue</text>
  <text class="small" x="740" y="602">Validation and remediation queues</text>
  <text class="small" x="740" y="634">Shared remediation slot queue</text>

  <rect class="compute" x="70" y="470" width="470" height="210"/>
  <text class="label" x="110" y="532">Dispatcher Job</text>
  <text class="small" x="110" y="570">Azure Container Apps Job</text>
  <text class="small" x="110" y="602">Moves each PDF job through stages</text>
  <text class="small" x="110" y="634">Publishes final artifact paths</text>

  <rect class="compute" x="1240" y="455" width="410" height="245"/>
  <text class="label" x="1280" y="515">Worker Jobs</text>
  <text class="small" x="1280" y="554">Validation workers scale separately</text>
  <text class="small" x="1280" y="586">PDFix, Callas, PDFix font fix</text>
  <text class="small" x="1280" y="618">share 4 remediation slots</text>
  <rect x="1280" y="645" width="270" height="34" rx="17" fill="#dcfce7" stroke="#16a34a"/>
  <text class="pill" x="1302" y="668">Global limit: 4 active fixes</text>

  <path class="line-amber" d="M970 360 C970 410, 960 430, 940 470"/>

  <path class="line-amber" d="M540 575 C590 575, 640 575, 700 575"/>
  <text class="tiny" x="575" y="555">orchestrate</text>

  <path class="line-amber" d="M1130 575 C1170 575, 1200 575, 1240 575"/>
  <text class="tiny" x="1152" y="555">work items</text>

  <path class="line-green" d="M1445 455 C1445 420, 1445 395, 1445 360"/>
  <text class="tiny" x="1462" y="417">read/write PDFs</text>

  <path class="line-blue" d="M1240 665 C1192 715, 1150 735, 1095 760"/>

  <rect class="azure" x="70" y="775" width="355" height="150"/>
  <text class="label" x="110" y="835">Azure Table Storage</text>
  <text class="small" x="110" y="874">Job status and stage history</text>
  <text class="small" x="110" y="904">One row per PDF job</text>

  <rect class="support" x="500" y="775" width="355" height="150"/>
  <text class="label" x="540" y="835">Azure Key Vault</text>
  <text class="small" x="540" y="874">PDFix and Callas secrets</text>
  <text class="small" x="540" y="904">Accessed by managed identity</text>

  <rect class="support" x="930" y="775" width="355" height="150"/>
  <text class="label" x="970" y="835">Container Registry</text>
  <text class="small" x="970" y="874">Web, dispatcher, and worker</text>
  <text class="small" x="970" y="904">container images</text>

  <rect class="support" x="1360" y="775" width="355" height="150"/>
  <text class="label" x="1400" y="835">Azure Monitor</text>
  <text class="small" x="1400" y="874">Logs, metrics, alerts</text>
  <text class="small" x="1400" y="904">DLQ and job health</text>

  <path class="line-muted" d="M250 775 C250 735, 285 710, 340 680"/>
  <path class="line-muted" d="M680 775 C690 725, 760 700, 835 680"/>
  <path class="line-muted" d="M1110 775 C1115 720, 1205 700, 1300 680"/>
  <path class="line-muted" d="M1538 775 C1538 735, 1508 720, 1480 700"/>

  <rect x="70" y="995" width="1580" height="58" rx="29" fill="#eff6ff" stroke="#bfdbfe"/>
  <text class="small" x="105" y="1025">Outcome: each PDF has three downloadable artifacts:</text>
  <text class="small" x="550" y="1025">pre-validation report, remediated PDF, and post-validation report.</text>
</svg>
