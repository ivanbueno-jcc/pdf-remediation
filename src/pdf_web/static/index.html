<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Remediation</title>
<style>
:root {
  --bg: #f6f7f9;
  --panel: #ffffff;
  --ink: #16191d;
  --muted: #5b6470;
  --line: #d9dee5;
  --accent: #1c4f8b;
  --ok: #1f7a43;
  --warn: #8a5a00;
  --bad: #a52222;
  --radius: 8px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171b;
    --panel: #1c2026;
    --ink: #e8ebef;
    --muted: #9aa4b1;
    --line: #333b45;
    --accent: #6fa8e0;
    --ok: #61c98c;
    --warn: #e0b062;
    --bad: #ef8080;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 24px 16px 64px;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
main { max-width: 1040px; margin: 0 auto; }
h1 { font-size: 22px; margin: 0 0 4px; }
h2 { font-size: 15px; margin: 0 0 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.sub { color: var(--muted); margin: 0 0 24px; }
section {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 18px;
}
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); border-radius: 999px;
  padding: 3px 11px; font-size: 13px; background: transparent;
}
.chip.ok { border-color: var(--ok); color: var(--ok); }
.chip.bad { border-color: var(--bad); color: var(--bad); }
.chip.warn { border-color: var(--warn); color: var(--warn); }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
#drop {
  border: 2px dashed var(--line); border-radius: var(--radius);
  padding: 32px 16px; text-align: center; color: var(--muted);
  transition: border-color .15s, background .15s; cursor: pointer;
}
#drop:hover, #drop:focus-within { border-color: var(--accent); }
#drop.over { border-color: var(--accent); background: rgba(28,79,139,.07); }
#drop strong { color: var(--ink); display: block; font-size: 16px; margin-bottom: 4px; }
#drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
td.name { word-break: break-all; max-width: 260px; }
.options { display: flex; flex-wrap: wrap; gap: 18px 24px; align-items: center; margin: 16px 0; }
label.field { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--muted); }
label.check { display: flex; align-items: center; gap: 7px; font-size: 14px; color: var(--ink); }
select, button {
  font: inherit; color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px;
}
button { cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .5; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; padding: 9px 20px; }
button.small { padding: 4px 10px; font-size: 13px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
ol.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
ol.steps li { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
ol.steps li .marker {
  width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line);
  display: grid; place-items: center; font-size: 11px; flex: none;
}
ol.steps li[data-state="running"] { color: var(--ink); font-weight: 600; }
ol.steps li[data-state="running"] .marker { border-color: var(--accent); color: var(--accent); }
ol.steps li[data-state="done"] { color: var(--ink); }
ol.steps li[data-state="done"] .marker { border-color: var(--ok); color: var(--ok); }
ol.steps li[data-state="failed"] .marker { border-color: var(--bad); color: var(--bad); }
ol.steps li[data-state="skipped"] { opacity: .55; font-style: italic; }
pre#log {
  margin: 0; padding: 12px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--bg); max-height: 320px; overflow: auto;
  font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  white-space: pre-wrap; word-break: break-word;
}
.banner { border-radius: 6px; padding: 11px 14px; margin-bottom: 14px; font-size: 14px; border: 1px solid; }
.banner.bad { border-color: var(--bad); color: var(--bad); }
.banner.warn { border-color: var(--warn); color: var(--warn); }
.banner.ok { border-color: var(--ok); color: var(--ok); }
.hidden { display: none !important; }
.muted { color: var(--muted); font-size: 13px; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
a.dl { font-size: 13px; text-decoration: none; border: 1px solid var(--line); border-radius: 5px; padding: 3px 9px; color: var(--ink); }
a.dl:hover { border-color: var(--accent); color: var(--accent); }
a.dl[aria-disabled="true"] { opacity: .4; pointer-events: none; }
tr.file-row { cursor: pointer; }
tr.file-row:hover > td { background: rgba(127,127,127,.06); }
td.expander { width: 26px; padding-right: 0; color: var(--muted); user-select: none; }
tr.detail-row > td { background: rgba(127,127,127,.05); padding: 0; }
.detail { padding: 12px 14px 14px 40px; }
.detail h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.detail ul { margin: 0 0 12px; padding-left: 18px; }
.detail li { margin-bottom: 5px; font-size: 13px; }
.detail li:last-child { margin-bottom: 0; }
.detail code { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
.detail .none { color: var(--ok); font-size: 13px; }
#rollup { margin: 0 0 16px; }
#rollup table { font-size: 13px; }
#rollup summary { cursor: pointer; font-size: 13px; color: var(--muted); padding: 6px 0; }
#rollup summary:hover { color: var(--ink); }
#jobs-body tr { cursor: pointer; }
#jobs-body tr:hover > td { background: rgba(127,127,127,.06); }
.pill { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
.pill.completed { border-color: var(--ok); color: var(--ok); }
.pill.cancelled { border-color: var(--warn); color: var(--warn); }
ol.steps li[data-state="cancelled"] { opacity: .6; }
ol.steps li[data-state="cancelled"] .marker { border-color: var(--warn); color: var(--warn); }
.pill.failed { border-color: var(--bad); color: var(--bad); }
.pill.running, .pill.queued { border-color: var(--accent); color: var(--accent); }

tr.job-row { cursor: pointer; }
tr.job-row:hover > td { background: rgba(127,127,127,.06); }
tr.job-row[data-open="true"] > td { background: rgba(127,127,127,.05); }
ol.stages { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
ol.stages li { display: flex; gap: 10px; align-items: baseline; font-size: 14px; }
ol.stages li .marker { width: 20px; flex: none; text-align: center; }
ol.stages li[data-status="ok"] .marker { color: var(--ok); }
ol.stages li[data-status="failed"] .marker { color: var(--bad); }
ol.stages li[data-status="skipped"] { opacity: .55; }
ol.stages li .detail { color: var(--muted); font-size: 13px; }
#rejected { margin-top: 12px; }
.progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--accent); transition: width .3s; }
</style>
</head>
<body>
<main>
  <h1>PDF Remediation</h1>
  <p class="sub"></p>
  <p class="muted" id="identity"></p>

  <section id="health-section">
    <h2>Environment</h2>
    <div id="health-banner" class="banner hidden"></div>
    <div class="chips" id="health-chips"><span class="muted">Checking&hellip;</span></div>
  </section>

  <section id="submit-section">
    <h2>New jobs</h2>
    <div id="drop" tabindex="-1">
      <label>
        <strong>Drop PDFs here</strong>
        <span>or <u>browse</u> to choose files &mdash; one job per file</span>
        <input type="file" id="file-input" multiple accept=".pdf,application/pdf">
      </label>
    </div>

    <table id="staged-table" class="hidden">
      <thead><tr><th>File</th><th>Size</th><th></th></tr></thead>
      <tbody id="staged-body"></tbody>
    </table>
    <p class="muted" id="staged-total"></p>

    <div class="options">
      <label class="field">Configuration
        <select id="config-select"></select>
      </label>
      <label class="check"><input type="checkbox" id="skip-font-fix"> Skip font fix</label>
      <label class="check"><input type="checkbox" id="strict"> Require WCAG&nbsp;+&nbsp;UA1</label>
    </div>

    <div class="row">
      <button class="primary" id="submit" disabled>Run pipeline</button>
      <span class="muted" id="submit-note"></span>
    </div>
    <div id="rejected"></div>
  </section>

  <section id="jobs-section" class="hidden">
    <h2>Jobs</h2>
    <p class="muted" id="queue-summary"></p>
    <table>
      <thead><tr><th></th><th>File</th><th>Status</th><th>Before</th><th>After</th><th>Downloads</th></tr></thead>
      <tbody id="jobs-body"></tbody>
    </table>
  </section>
</main>

<script>
'use strict';

const MAX_LOG_LINES = 2000;
const POLL_MS = 2000;

const state = {
  staged: [],
  health: null,
  authError: null,
  openJobId: null,
  source: null,
  pollTimer: null,
  logLines: [],
  jobs: [],
};

const el = (id) => document.getElementById(id);

function formatBytes(bytes) {
  if (bytes < 1024) return bytes + ' B';
  const units = ['KB', 'MB', 'GB'];
  let value = bytes / 1024, index = 0;
  while (value >= 1024 && index < units.length - 1) { value /= 1024; index += 1; }
  return value.toFixed(value >= 10 ? 0 : 1) + ' ' + units[index];
}

function describeError(payload) {
  const detail = payload && payload.detail;
  if (typeof detail === 'string') return detail;
  if (Array.isArray(detail)) return detail.map((e) => e.msg || JSON.stringify(e)).join('; ');
  return 'Request failed.';
}

/* ---------- environment ---------- */

async function loadHealth() {
  try {
    const response = await fetch('/api/health');
    if (response.status === 401 || response.status === 403) {
      const payload = await response.json().catch(() => ({}));
      state.authError = describeError(payload);
      state.health = { checks: [], can_submit: false, blocking: [] };
    } else {
      state.authError = null;
      state.health = await response.json();
    }
  } catch (error) {
    state.authError = null;
    state.health = { checks: [], can_submit: false, blocking: ['server unreachable'] };
  }
  renderIdentity();
  renderHealth();
  updateSubmitState();
}

function renderIdentity() {
  const line = el('identity');
  const auth = (state.health && state.health.auth) || {};
  if (state.authError || !state.health.user) { line.textContent = ''; return; }
  line.textContent = auth.multi_user
    ? 'Signed in as ' + state.health.user + ' \u00b7 your jobs are private to you'
    : 'Single-user mode \u00b7 ' + state.health.user;
}

function renderHealth() {
  const checks = state.health.checks || [];
  const missing = checks.filter((check) => !check.ok);
  const section = el('health-section');

  // Nothing to tell the user: hide the whole section rather than showing an
  // all-green checklist nobody needs to read.
  const showSection = Boolean(state.authError) || missing.length > 0 ||
    !state.health.can_submit;
  section.classList.toggle('hidden', !showSection);
  if (!showSection) return;

  const container = el('health-chips');
  container.innerHTML = '';
  missing.forEach((check) => {
    const chip = document.createElement('span');
    chip.className = 'chip ' + (check.required ? 'bad' : 'warn');
    chip.innerHTML = '<span class="dot"></span>';
    chip.append(check.name + ' \u2014 ' + check.detail);
    chip.title = check.detail;
    container.appendChild(chip);
  });

  const banner = el('health-banner');
  if (state.authError) {
    banner.className = 'banner bad';
    banner.textContent = state.authError;
    return;
  }
  if (!state.health.can_submit) {
    banner.className = 'banner bad';
    banner.textContent = 'Cannot run: ' + (state.health.blocking || []).join(', ') +
      '. Validation would report every file as unvalidatable, so submitting is disabled.';
  } else if (state.health.recommend_skip_font_fix) {
    banner.className = 'banner warn';
    banner.textContent = 'Docker is unavailable, so font repair will be skipped. ' +
      'Everything else still runs.';
  } else {
    banner.className = 'banner hidden';
  }
}

async function loadConfigs() {
  const select = el('config-select');
  try {
    const payload = await (await fetch('/api/config-files')).json();
    select.innerHTML = '';
    payload.files.forEach((entry) => {
      const option = document.createElement('option');
      option.value = entry.name;
      option.textContent = entry.name + (entry.available ? '' : ' (missing)');
      option.disabled = !entry.available;
      option.selected = entry.name === payload.default;
      select.appendChild(option);
    });
  } catch (error) {
    select.innerHTML = '<option>default.json</option>';
  }
}

/* ---------- staging ---------- */

function addFiles(fileList) {
  Array.from(fileList).forEach((file) => {
    if (!file.name.toLowerCase().endsWith('.pdf')) return;
    if (!state.staged.some((s) => s.name === file.name && s.size === file.size)) {
      state.staged.push(file);
    }
  });
  renderStaged();
  updateSubmitState();
}

function renderStaged() {
  const body = el('staged-body');
  body.innerHTML = '';
  el('staged-table').classList.toggle('hidden', state.staged.length === 0);

  state.staged.forEach((file, index) => {
    const row = document.createElement('tr');
    const name = document.createElement('td');
    name.className = 'name';
    name.textContent = file.name;
    const size = document.createElement('td');
    size.textContent = formatBytes(file.size);
    const action = document.createElement('td');
    const remove = document.createElement('button');
    remove.className = 'small';
    remove.textContent = 'Remove';
    remove.addEventListener('click', () => {
      state.staged.splice(index, 1);
      renderStaged();
      updateSubmitState();
    });
    action.appendChild(remove);
    row.append(name, size, action);
    body.appendChild(row);
  });

  const total = state.staged.reduce((sum, f) => sum + f.size, 0);
  el('staged-total').textContent = state.staged.length
    ? state.staged.length + ' file(s), ' + formatBytes(total) +
      ' \u2014 ' + state.staged.length + ' job(s)'
    : '';
}

function updateSubmitState() {
  const healthy = Boolean(state.health && state.health.can_submit);
  el('submit').disabled = !(healthy && state.staged.length);
  if (!healthy) el('submit-note').textContent = 'Fix the environment problems above first.';
  else if (!state.staged.length) el('submit-note').textContent = 'Add at least one PDF.';
  else el('submit-note').textContent = '';
}

/* ---------- submit ---------- */

async function submitJobs() {
  const form = new FormData();
  state.staged.forEach((file) => form.append('files', file, file.name));
  form.append('config_file', el('config-select').value);
  form.append('skip_font_fix', el('skip-font-fix').checked ? 'true' : 'false');
  form.append('wcag_and_ua1_must_pass', el('strict').checked ? 'true' : 'false');

  el('submit').disabled = true;
  el('submit-note').textContent = 'Uploading\u2026';

  let payload;
  try {
    const response = await fetch('/api/jobs', { method: 'POST', body: form });
    payload = await response.json();
    if (!response.ok) throw new Error(describeError(payload));
  } catch (error) {
    el('submit-note').textContent = String(error.message || error);
    updateSubmitState();
    return;
  }

  state.staged = [];
  renderStaged();
  renderRejected(payload.rejected || []);
  el('submit-note').textContent =
    payload.jobs.length + ' job(s) queued \u00b7 ' + payload.concurrency +
    ' run at a time, ' + payload.your_limit + ' of yours at once.';
  updateSubmitState();
  startPolling();
}

function renderRejected(rejected) {
  const container = el('rejected');
  container.innerHTML = '';
  if (!rejected.length) return;
  const banner = document.createElement('div');
  banner.className = 'banner warn';
  banner.textContent = rejected.length + ' file(s) were not accepted: ' +
    rejected.map((r) => r.original_name + ' (' + r.reason + ')').join('; ');
  container.appendChild(banner);
}

/* ---------- the job list ---------- */

function startPolling() {
  if (state.pollTimer) return;
  refreshQueue();
  state.pollTimer = setInterval(refreshQueue, POLL_MS);
}

function stopPolling() {
  if (state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = null; }
}

async function refreshQueue() {
  let payload;
  try {
    const response = await fetch('/api/queue');
    if (!response.ok) { stopPolling(); return; }
    payload = await response.json();
  } catch (error) { return; }

  state.jobs = payload.jobs || [];
  el('jobs-section').classList.toggle('hidden', state.jobs.length === 0);
  el('queue-summary').textContent = state.jobs.length
    ? payload.your_running + ' of ' + payload.your_limit +
      ' running \u00b7 ' + payload.concurrency + ' processed at a time'
    : '';
  renderJobs();

  // Nothing is moving, so stop asking.
  if (payload.all_terminal) stopPolling();
}

const STATUS_MARK = { completed: '\u2713', failed: '\u2715', cancelled: '\u2298',
                      running: '\u25b8', queued: '\u00b7' };

function renderJobs() {
  const body = el('jobs-body');
  const open = state.openJobId;
  body.innerHTML = '';

  state.jobs.forEach((job) => {
    const row = document.createElement('tr');
    row.className = 'job-row';
    row.dataset.jobId = job.job_id;
    row.tabIndex = 0;

    const marker = document.createElement('td');
    marker.className = 'expander';
    marker.textContent = STATUS_MARK[job.status] || '';

    const name = document.createElement('td');
    name.className = 'name';
    name.textContent = job.name;

    const status = document.createElement('td');
    status.textContent = job.outcome_label || describeStatus(job);
    if (job.error) {
      const note = document.createElement('div');
      note.className = 'muted';
      note.textContent = job.error;
      status.appendChild(note);
    }

    const before = document.createElement('td');
    before.innerHTML = reportChips(job.before);
    const after = document.createElement('td');
    after.innerHTML = reportChips(job.after);

    const downloads = document.createElement('td');
    downloads.className = 'actions';
    const base = '/api/jobs/' + job.job_id + '/';
    downloads.appendChild(link(base + 'pdf', 'PDF', job.has_pdf));
    downloads.appendChild(link(base + 'before', 'Before', Boolean(job.before)));
    downloads.appendChild(link(base + 'after', 'After', Boolean(job.after)));
    downloads.appendChild(link(base + 'download', 'ZIP', job.status === 'completed'));
    downloads.addEventListener('click', (event) => event.stopPropagation());

    row.append(marker, name, status, before, after, downloads);
    body.appendChild(row);

    const detail = document.createElement('tr');
    detail.className = 'detail-row hidden';
    const cell = document.createElement('td');
    cell.colSpan = 6;
    detail.appendChild(cell);
    body.appendChild(detail);

    const toggle = () => toggleJob(job, row, detail, cell);
    row.addEventListener('click', toggle);
    row.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); toggle(); }
    });

    if (open === job.job_id) toggleJob(job, row, detail, cell, true);
  });
}

function describeStatus(job) {
  if (job.status === 'queued') {
    if (job.jobs_ahead === 0 || job.jobs_ahead === null) return 'Queued \u2014 next to run.';
    return 'Queued \u2014 ' + job.jobs_ahead + ' ahead.';
  }
  if (job.status === 'running') {
    return job.current_stage ? 'Running \u2014 ' + job.current_stage : 'Running\u2026';
  }
  return job.status;
}

function reportChips(report) {
  if (!report) return '\u2014';
  return ['ua1', 'wcag'].map((profile) => {
    const entry = (report.profiles || {})[profile];
    if (!entry) return '';
    const label = profile === 'ua1' ? 'UA1' : 'WCAG';
    const tone = entry.status === 'pass' ? 'ok' : (entry.status === 'error' ? 'warn' : 'bad');
    const count = entry.failed_rules_count ? ' \u00b7 ' + entry.failed_rules_count : '';
    return '<span class="chip ' + tone + '"><span class="dot"></span>' +
      label + ' ' + entry.status + count + '</span>';
  }).join(' ');
}

function link(href, label, enabled) {
  const anchor = document.createElement('a');
  anchor.className = 'dl';
  anchor.textContent = label;
  if (enabled) anchor.href = href;
  else anchor.setAttribute('aria-disabled', 'true');
  return anchor;
}

/* ---------- job detail ---------- */

async function toggleJob(job, row, detailRow, cell, forceOpen) {
  const isOpen = row.dataset.open === 'true';
  if (isOpen && !forceOpen) {
    row.dataset.open = 'false';
    detailRow.classList.add('hidden');
    state.openJobId = null;
    stopStreaming();
    return;
  }

  state.openJobId = job.job_id;
  row.dataset.open = 'true';
  detailRow.classList.remove('hidden');
  cell.innerHTML = '<div class="detail muted">Loading\u2026</div>';

  const response = await fetch('/api/jobs/' + job.job_id);
  if (!response.ok) { cell.innerHTML = '<div class="detail muted">Unavailable.</div>'; return; }
  renderDetail(cell, await response.json());
}

function renderDetail(cell, job) {
  cell.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'detail';

  const stagesHeading = document.createElement('h4');
  stagesHeading.textContent = 'Pipeline stages';
  wrap.appendChild(stagesHeading);

  const list = document.createElement('ol');
  list.className = 'stages';
  (job.stages || []).forEach((stage) => {
    const item = document.createElement('li');
    item.dataset.status = stage.status;
    const marker = document.createElement('span');
    marker.className = 'marker';
    marker.textContent = stage.status === 'ok' ? '\u2713'
      : (stage.status === 'failed' ? '\u2715' : '\u2013');
    const label = document.createElement('span');
    label.textContent = stage.name;
    const detail = document.createElement('span');
    detail.className = 'detail';
    detail.textContent = stage.detail || '';
    item.append(marker, label, detail);
    list.appendChild(item);
  });
  wrap.appendChild(list);

  (job.warnings || []).forEach((warning) => {
    const note = document.createElement('p');
    note.className = 'muted';
    note.textContent = warning;
    wrap.appendChild(note);
  });

  ['before', 'after'].forEach((stage) => {
    if (!job[stage]) return;
    const heading = document.createElement('h4');
    heading.textContent = stage === 'before' ? 'Before remediation' : 'After remediation';
    wrap.appendChild(heading);
    wrap.appendChild(violationList(job.job_id, stage));
  });

  if (job.status === 'queued' || job.status === 'running') {
    const cancel = document.createElement('button');
    cancel.className = 'small';
    cancel.textContent = 'Cancel job';
    cancel.addEventListener('click', async (event) => {
      event.stopPropagation();
      cancel.disabled = true;
      await fetch('/api/jobs/' + job.job_id + '/cancel', { method: 'POST' });
      refreshQueue();
    });
    wrap.appendChild(cancel);
  }

  cell.appendChild(wrap);
}

function violationList(jobId, stage) {
  const list = document.createElement('ul');
  list.innerHTML = '<li class="muted">Loading\u2026</li>';
  fetch('/api/jobs/' + jobId + '/' + stage)
    .then((response) => (response.ok ? response.json() : null))
    .then((report) => {
      list.innerHTML = '';
      const merged = mergeViolations(report);
      if (!merged.length) {
        const none = document.createElement('li');
        none.className = 'none';
        none.textContent = 'No violations reported.';
        list.appendChild(none);
        return;
      }
      merged.forEach((violation) => {
        const item = document.createElement('li');
        const code = document.createElement('code');
        code.textContent = violation.clause_test;
        const profiles = document.createElement('span');
        profiles.className = 'muted';
        profiles.textContent = ' ' + violation.profiles.join(', ') + ' ';
        item.append(code, profiles, violation.description || '');
        list.appendChild(item);
      });
    })
    .catch(() => { list.innerHTML = '<li class="muted">Unavailable.</li>'; });
  return list;
}

function mergeViolations(report) {
  if (!report) return [];
  const merged = new Map();
  ['ua1', 'wcag'].forEach((profile) => {
    (((report.profiles || {})[profile] || {}).violations || []).forEach((violation) => {
      const key = violation.clause_test || 'unknown';
      if (!merged.has(key)) {
        merged.set(key, { clause_test: key, description: violation.description || '',
                          profiles: [] });
      }
      const entry = merged.get(key);
      const label = profile.toUpperCase();
      if (!entry.profiles.includes(label)) entry.profiles.push(label);
      if (!entry.description) entry.description = violation.description || '';
    });
  });
  return Array.from(merged.values())
    .sort((a, b) => a.clause_test.localeCompare(b.clause_test));
}

function stopStreaming() {
  if (state.source) { state.source.close(); state.source = null; }
}

/* ---------- wiring ---------- */

const drop = el('drop');
['dragenter', 'dragover'].forEach((type) => {
  drop.addEventListener(type, (event) => { event.preventDefault(); drop.classList.add('over'); });
});
['dragleave', 'drop'].forEach((type) => {
  drop.addEventListener(type, (event) => { event.preventDefault(); drop.classList.remove('over'); });
});
drop.addEventListener('drop', (event) => {
  if (event.dataTransfer && event.dataTransfer.files) addFiles(event.dataTransfer.files);
});
el('file-input').addEventListener('change', (event) => {
  addFiles(event.target.files);
  event.target.value = '';
});
el('submit').addEventListener('click', submitJobs);

loadConfigs();
loadHealth();
refreshQueue();
startPolling();
</script>
