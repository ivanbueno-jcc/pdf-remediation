<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Remediation</title>
<style>
:root {
  --bg: #f6f7f9;
  --panel: #ffffff;
  --ink: #16191d;
  --muted: #5b6470;
  --line: #d9dee5;
  --accent: #1c4f8b;
  --ok: #1f7a43;
  --warn: #8a5a00;
  --bad: #a52222;
  --radius: 8px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171b;
    --panel: #1c2026;
    --ink: #e8ebef;
    --muted: #9aa4b1;
    --line: #333b45;
    --accent: #6fa8e0;
    --ok: #61c98c;
    --warn: #e0b062;
    --bad: #ef8080;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 24px 16px 64px;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
main { max-width: 1040px; margin: 0 auto; }
h1 { font-size: 22px; margin: 0 0 4px; }
h2 { font-size: 15px; margin: 0 0 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.sub { color: var(--muted); margin: 0 0 24px; }
section {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 18px;
}
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); border-radius: 999px;
  padding: 3px 11px; font-size: 13px; background: transparent;
}
.chip.ok { border-color: var(--ok); color: var(--ok); }
.chip.bad { border-color: var(--bad); color: var(--bad); }
.chip.warn { border-color: var(--warn); color: var(--warn); }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
#drop {
  border: 2px dashed var(--line); border-radius: var(--radius);
  padding: 32px 16px; text-align: center; color: var(--muted);
  transition: border-color .15s, background .15s; cursor: pointer;
}
#drop:hover, #drop:focus-within { border-color: var(--accent); }
#drop.over { border-color: var(--accent); background: rgba(28,79,139,.07); }
#drop strong { color: var(--ink); display: block; font-size: 16px; margin-bottom: 4px; }
#drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
td.name { word-break: break-all; max-width: 260px; }
.options { display: flex; flex-wrap: wrap; gap: 18px 24px; align-items: center; margin: 16px 0; }
label.field { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--muted); }
label.check { display: flex; align-items: center; gap: 7px; font-size: 14px; color: var(--ink); }
select, button {
  font: inherit; color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px;
}
button { cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .5; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; padding: 9px 20px; }
button.small { padding: 4px 10px; font-size: 13px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
ol.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
ol.steps li { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
ol.steps li .marker {
  width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line);
  display: grid; place-items: center; font-size: 11px; flex: none;
}
ol.steps li[data-state="running"] { color: var(--ink); font-weight: 600; }
ol.steps li[data-state="running"] .marker { border-color: var(--accent); color: var(--accent); }
ol.steps li[data-state="done"] { color: var(--ink); }
ol.steps li[data-state="done"] .marker { border-color: var(--ok); color: var(--ok); }
ol.steps li[data-state="failed"] .marker { border-color: var(--bad); color: var(--bad); }
ol.steps li[data-state="skipped"] { opacity: .55; font-style: italic; }
pre#log {
  margin: 0; padding: 12px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--bg); max-height: 320px; overflow: auto;
  font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  white-space: pre-wrap; word-break: break-word;
}
.banner { border-radius: 6px; padding: 11px 14px; margin-bottom: 14px; font-size: 14px; border: 1px solid; }
.banner.bad { border-color: var(--bad); color: var(--bad); }
.banner.warn { border-color: var(--warn); color: var(--warn); }
.banner.ok { border-color: var(--ok); color: var(--ok); }
.hidden { display: none !important; }
.muted { color: var(--muted); font-size: 13px; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
a.dl { font-size: 13px; text-decoration: none; border: 1px solid var(--line); border-radius: 5px; padding: 3px 9px; color: var(--ink); }
a.dl:hover { border-color: var(--accent); color: var(--accent); }
a.dl[aria-disabled="true"] { opacity: .4; pointer-events: none; }
</style>
</head>
<body>
<main>
  <h1>PDF Remediation</h1>
  <p class="sub">Drop PDFs, pick a configuration, and run the full remediation pipeline: validate, remediate, validate again.</p>

  <section id="health-section">
    <h2>Environment</h2>
    <div id="health-banner" class="banner hidden"></div>
    <div class="chips" id="health-chips"><span class="muted">Checking&hellip;</span></div>
  </section>

  <section id="submit-section">
    <h2>New job</h2>
    <div id="drop" tabindex="-1">
      <label>
        <strong>Drop PDFs here</strong>
        <span>or <u>browse</u> to choose files</span>
        <input type="file" id="file-input" multiple accept=".pdf,application/pdf">
      </label>
    </div>

    <table id="staged-table" class="hidden">
      <thead><tr><th>File</th><th>Size</th><th></th></tr></thead>
      <tbody id="staged-body"></tbody>
    </table>
    <p class="muted" id="staged-total"></p>

    <div class="options">
      <label class="field">Configuration
        <select id="config-select"></select>
      </label>
      <label class="check"><input type="checkbox" id="skip-font-fix"> Skip font fix (steps 3&ndash;4)</label>
      <label class="check"><input type="checkbox" id="strict"> Require WCAG&nbsp;+&nbsp;UA1</label>
      <label class="check"><input type="checkbox" id="verbose"> Verbose log</label>
    </div>

    <div class="row">
      <button class="primary" id="submit" disabled>Run pipeline</button>
      <span class="muted" id="submit-note"></span>
    </div>
  </section>

  <section id="job-section" class="hidden">
    <h2>Progress</h2>
    <div id="job-banner" class="banner hidden"></div>
    <p id="job-status" role="status" aria-live="polite" class="muted"></p>
    <ol class="steps" id="steps"></ol>
    <div class="row" style="margin-top:16px">
      <button class="small" id="new-job">Start another job</button>
      <a class="dl" id="download-all" aria-disabled="true" href="#">Download all (.zip)</a>
      <a class="dl" id="download-log" aria-disabled="true" href="#">Download log</a>
    </div>
  </section>

  <section id="results-section" class="hidden">
    <h2>Results</h2>
    <table>
      <thead><tr><th>File</th><th>Outcome</th><th>Before</th><th>After</th><th>Downloads</th></tr></thead>
      <tbody id="results-body"></tbody>
    </table>
  </section>

  <section id="log-section" class="hidden">
    <h2>Pipeline output</h2>
    <label class="check" style="margin-bottom:10px"><input type="checkbox" id="follow" checked> Follow output</label>
    <pre id="log" aria-live="off"></pre>
  </section>
</main>

<script>
'use strict';

const MAX_LOG_LINES = 2000;
const state = {
  staged: [],
  jobId: null,
  cursor: 0,
  source: null,
  pollTimer: null,
  health: null,
  logLines: [],
};

const el = (id) => document.getElementById(id);

function formatBytes(bytes) {
  if (bytes < 1024) return bytes + ' B';
  const units = ['KB', 'MB', 'GB'];
  let value = bytes / 1024;
  let index = 0;
  while (value >= 1024 && index < units.length - 1) { value /= 1024; index += 1; }
  return value.toFixed(value >= 10 ? 0 : 1) + ' ' + units[index];
}

/* ---------- health ---------- */

async function loadHealth() {
  try {
    const response = await fetch('/api/health');
    state.health = await response.json();
  } catch (error) {
    state.health = { checks: [], can_submit: false, blocking: ['server'] };
  }
  renderHealth();
  updateSubmitState();
}

function renderHealth() {
  const container = el('health-chips');
  container.innerHTML = '';
  (state.health.checks || []).forEach((check) => {
    const chip = document.createElement('span');
    chip.className = 'chip ' + (check.ok ? 'ok' : (check.required ? 'bad' : 'warn'));
    chip.innerHTML = '<span class="dot"></span>';
    chip.append(check.name + (check.ok ? '' : ' — ' + check.detail));
    chip.title = check.detail;
    container.appendChild(chip);
  });

  const banner = el('health-banner');
  if (!state.health.can_submit) {
    banner.className = 'banner bad';
    banner.textContent = 'Cannot run: ' + (state.health.blocking || []).join(', ') +
      '. Validation would silently report every file as unvalidatable, so submitting is disabled.';
  } else if (state.health.recommend_skip_font_fix) {
    banner.className = 'banner warn';
    banner.textContent = 'Docker is not running, so the font-fix steps would abort the pipeline. ' +
      '"Skip font fix" has been enabled for you.';
    el('skip-font-fix').checked = true;
  } else {
    banner.className = 'banner hidden';
  }
}

async function loadConfigs() {
  const select = el('config-select');
  try {
    const response = await fetch('/api/config-files');
    const payload = await response.json();
    select.innerHTML = '';
    payload.files.forEach((entry) => {
      const option = document.createElement('option');
      option.value = entry.name;
      option.textContent = entry.name + (entry.available ? '' : ' (missing)');
      option.disabled = !entry.available;
      option.selected = entry.name === payload.default;
      select.appendChild(option);
    });
  } catch (error) {
    select.innerHTML = '<option>default.json</option>';
  }
}

/* ---------- staging ---------- */

function addFiles(fileList) {
  Array.from(fileList).forEach((file) => {
    if (!file.name.toLowerCase().endsWith('.pdf')) return;
    const duplicate = state.staged.some(
      (staged) => staged.name === file.name && staged.size === file.size
    );
    if (!duplicate) state.staged.push(file);
  });
  renderStaged();
  updateSubmitState();
}

function renderStaged() {
  const table = el('staged-table');
  const body = el('staged-body');
  body.innerHTML = '';
  table.classList.toggle('hidden', state.staged.length === 0);

  state.staged.forEach((file, index) => {
    const row = document.createElement('tr');
    const name = document.createElement('td');
    name.className = 'name';
    name.textContent = file.name;
    const size = document.createElement('td');
    size.textContent = formatBytes(file.size);
    const action = document.createElement('td');
    const remove = document.createElement('button');
    remove.className = 'small';
    remove.textContent = 'Remove';
    remove.addEventListener('click', () => {
      state.staged.splice(index, 1);
      renderStaged();
      updateSubmitState();
    });
    action.appendChild(remove);
    row.append(name, size, action);
    body.appendChild(row);
  });

  const total = state.staged.reduce((sum, file) => sum + file.size, 0);
  el('staged-total').textContent = state.staged.length
    ? state.staged.length + ' file(s), ' + formatBytes(total)
    : '';
}

function updateSubmitState() {
  const healthy = Boolean(state.health && state.health.can_submit);
  const ready = healthy && state.staged.length > 0 && !state.jobId;
  el('submit').disabled = !ready;
  if (!healthy) el('submit-note').textContent = 'Fix the environment problems above first.';
  else if (state.jobId) el('submit-note').textContent = 'A job is already running in this tab.';
  else if (!state.staged.length) el('submit-note').textContent = 'Add at least one PDF.';
  else el('submit-note').textContent = '';
}

/* ---------- submit ---------- */

async function submitJob() {
  const form = new FormData();
  state.staged.forEach((file) => form.append('files', file, file.name));
  form.append('config_file', el('config-select').value);
  form.append('skip_font_fix', el('skip-font-fix').checked ? 'true' : 'false');
  form.append('wcag_and_ua1_must_pass', el('strict').checked ? 'true' : 'false');
  form.append('verbose', el('verbose').checked ? 'true' : 'false');

  el('submit').disabled = true;
  el('submit-note').textContent = 'Uploading…';

  let payload;
  try {
    const response = await fetch('/api/jobs', { method: 'POST', body: form });
    payload = await response.json();
    if (!response.ok) throw new Error(describeError(payload));
  } catch (error) {
    el('submit-note').textContent = String(error.message || error);
    updateSubmitState();
    return;
  }

  state.jobId = payload.job_id;
  state.cursor = 0;
  state.logLines = [];
  el('log').textContent = '';
  el('job-section').classList.remove('hidden');
  el('log-section').classList.remove('hidden');
  el('results-section').classList.add('hidden');
  renderJob(payload);
  connect();
  updateSubmitState();
}

function describeError(payload) {
  const detail = payload && payload.detail;
  if (typeof detail === 'string') return detail;
  if (Array.isArray(detail)) {
    return detail.map((entry) => entry.msg || JSON.stringify(entry)).join('; ');
  }
  return 'Upload failed.';
}

/* ---------- streaming ---------- */

function connect() {
  const url = '/api/jobs/' + state.jobId + '/events?since=' + state.cursor;
  try {
    state.source = new EventSource(url);
  } catch (error) {
    startPolling();
    return;
  }
  ['log', 'step', 'status', 'done'].forEach((type) => {
    state.source.addEventListener(type, (event) => handleEvent(JSON.parse(event.data)));
  });
  state.source.onerror = () => {
    state.source.close();
    state.source = null;
    startPolling();
  };
}

function startPolling() {
  if (state.pollTimer) return;
  state.pollTimer = setInterval(refresh, 2000);
  refresh();
}

function stopStreaming() {
  if (state.source) { state.source.close(); state.source = null; }
  if (state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = null; }
}

async function refresh() {
  if (!state.jobId) return;
  const response = await fetch('/api/jobs/' + state.jobId + '?since=' + state.cursor);
  if (!response.ok) { stopStreaming(); return; }
  const payload = await response.json();
  (payload.events || []).forEach(handleEvent);
  renderJob(payload);
  if (payload.status === 'completed' || payload.status === 'failed') {
    stopStreaming();
    finish(payload);
  }
}

function handleEvent(event) {
  if (event.cursor) state.cursor = Math.max(state.cursor, event.cursor);
  if (event.type === 'log') appendLog(event.payload.line);
  else if (event.type === 'done') { stopStreaming(); refreshFinal(); }
  else if (event.type === 'step' || event.type === 'status') refreshState();
}

let pendingRefresh = null;
function refreshState() {
  if (pendingRefresh) return;
  pendingRefresh = setTimeout(async () => {
    pendingRefresh = null;
    if (!state.jobId) return;
    const response = await fetch('/api/jobs/' + state.jobId);
    if (response.ok) renderJob(await response.json());
  }, 120);
}

async function refreshFinal() {
  const response = await fetch('/api/jobs/' + state.jobId);
  if (!response.ok) return;
  const payload = await response.json();
  renderJob(payload);
  finish(payload);
}

function appendLog(line) {
  state.logLines.push(line);
  if (state.logLines.length > MAX_LOG_LINES) {
    state.logLines.splice(0, state.logLines.length - MAX_LOG_LINES);
  }
  const pane = el('log');
  pane.textContent = state.logLines.join('\n');
  if (el('follow').checked) pane.scrollTop = pane.scrollHeight;
}

/* ---------- rendering ---------- */

const STEP_MARKS = { done: '✓', failed: '✕', skipped: '–', running: '▸', pending: '' };

function renderJob(job) {
  const list = el('steps');
  list.innerHTML = '';
  (job.steps || []).forEach((step) => {
    const item = document.createElement('li');
    item.dataset.state = step.state;
    if (step.state === 'running') item.setAttribute('aria-current', 'step');
    const marker = document.createElement('span');
    marker.className = 'marker';
    marker.textContent = STEP_MARKS[step.state] || String(step.number);
    const label = document.createElement('span');
    label.textContent = step.number + '. ' + step.name +
      (step.state === 'skipped' ? ' (skipped)' : '');
    item.append(marker, label);
    list.appendChild(item);
  });

  const statusText = {
    queued: 'Queued — waiting for the worker.',
    running: 'Running…',
    completed: 'Completed.',
    failed: 'Failed.',
  }[job.status] || job.status;
  el('job-status').textContent = job.job_id + ' · ' + statusText;

  const banner = el('job-banner');
  if (job.status === 'failed') {
    banner.className = 'banner bad';
    banner.textContent = (job.error || 'The pipeline stopped.') +
      (job.partial ? ' Partial results below are still downloadable.' : '');
  } else if (job.status === 'completed') {
    banner.className = 'banner ok';
    banner.textContent = 'Pipeline completed successfully.';
  } else {
    banner.className = 'banner hidden';
  }
}

function finish(job) {
  el('download-all').href = '/api/jobs/' + job.job_id + '/download';
  el('download-all').setAttribute('aria-disabled', 'false');
  el('download-log').href = '/api/jobs/' + job.job_id + '/log';
  el('download-log').setAttribute('aria-disabled', 'false');
  renderResults(job);
}

function reportChips(report) {
  if (!report) return '—';
  return ['ua1', 'wcag'].map((profile) => {
    const entry = (report.profiles || {})[profile];
    if (!entry) return '';
    const label = profile === 'ua1' ? 'UA1' : 'WCAG';
    const tone = entry.status === 'pass' ? 'ok' : (entry.status === 'error' ? 'warn' : 'bad');
    const count = entry.failed_rules_count ? ' · ' + entry.failed_rules_count : '';
    return '<span class="chip ' + tone + '"><span class="dot"></span>' +
      label + ' ' + entry.status + count + '</span>';
  }).join(' ');
}

function renderResults(job) {
  const body = el('results-body');
  body.innerHTML = '';
  const byId = {};
  (job.results || []).forEach((result) => { byId[result.file_id] = result; });

  (job.files || []).forEach((file) => {
    const result = byId[file.file_id] || {};
    const row = document.createElement('tr');

    const name = document.createElement('td');
    name.className = 'name';
    name.textContent = file.original_name;

    const outcome = document.createElement('td');
    outcome.textContent = result.outcome_label || result.outcome || '—';
    if (result.note) {
      const note = document.createElement('div');
      note.className = 'muted';
      note.textContent = result.note;
      outcome.appendChild(note);
    }

    const before = document.createElement('td');
    before.innerHTML = reportChips(result.before);
    const after = document.createElement('td');
    after.innerHTML = reportChips(result.after);

    const downloads = document.createElement('td');
    downloads.className = 'actions';
    const base = '/api/jobs/' + job.job_id + '/files/' + file.file_id + '/';
    downloads.appendChild(downloadLink(base + 'pdf', 'PDF', Boolean(result.has_pdf)));
    downloads.appendChild(downloadLink(base + 'before', 'Before', Boolean(result.before)));
    downloads.appendChild(downloadLink(base + 'after', 'After', Boolean(result.after)));

    row.append(name, outcome, before, after, downloads);
    body.appendChild(row);
  });

  el('results-section').classList.toggle('hidden', (job.files || []).length === 0);
}

function downloadLink(href, label, enabled) {
  const link = document.createElement('a');
  link.className = 'dl';
  link.textContent = label;
  if (enabled) link.href = href;
  else link.setAttribute('aria-disabled', 'true');
  return link;
}

/* ---------- wiring ---------- */

const drop = el('drop');
['dragenter', 'dragover'].forEach((type) => {
  drop.addEventListener(type, (event) => {
    event.preventDefault();
    drop.classList.add('over');
  });
});
['dragleave', 'drop'].forEach((type) => {
  drop.addEventListener(type, (event) => {
    event.preventDefault();
    drop.classList.remove('over');
  });
});
drop.addEventListener('drop', (event) => {
  if (event.dataTransfer && event.dataTransfer.files) addFiles(event.dataTransfer.files);
});
el('file-input').addEventListener('change', (event) => {
  addFiles(event.target.files);
  event.target.value = '';
});
el('submit').addEventListener('click', submitJob);
el('new-job').addEventListener('click', () => {
  stopStreaming();
  state.jobId = null;
  state.staged = [];
  state.cursor = 0;
  renderStaged();
  updateSubmitState();
  el('job-section').classList.add('hidden');
  el('results-section').classList.add('hidden');
  el('log-section').classList.add('hidden');
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

loadConfigs();
loadHealth();
</script>
</body>
</html>
